name: hatch2revenue
description: "A comprehensive poultry farm management application for tracking birds from day-old chicks to layer stage, with vaccination scheduling, feed monitoring, mortality tracking, egg production forecasting, and financial analysis."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management
  provider: ^6.1.2
  
  # Local Database
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3 # desktop (Windows/Linux) support
  path: ^1.9.0
  
  # Local Notifications
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  
  # Charts & Analytics
  fl_chart: ^0.68.0
  
  # PDF Generation
  pdf: ^3.10.8
  printing: ^5.12.0
  path_provider: ^2.1.3

  # Sharing exports (WhatsApp, email, etc.)
  share_plus: ^13.1.0

  # Backup restore (pick a .db backup file)
  file_picker: 12.0.0-beta.1

  # Cloud sync (offline-first: local SQLite is the source of truth,
  # changes sync to Supabase when the farmer has internet)
  supabase_flutter: ^2.8.0
  connectivity_plus: ^6.0.5
  
  # Fonts
  google_fonts: ^6.2.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/chicken.png
    - assets/chicken_tractor.png
    # Bundled fonts so the app renders correctly with no internet —
    # google_fonts loads these instead of fetching at runtime.
    - google_fonts/
